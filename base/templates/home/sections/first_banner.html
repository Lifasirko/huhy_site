{% load static %}
<section class="banner">
        <div class="banner-content">
            <div class="text-container">
                <span class="left">Грай</span>
                <span class="middle">Твори</span>
                <span class="right">Відпочивай</span>
            </div>
        </div>
        <img src="{% static 'images/banner.jpg' %}" alt="Banner Image" class="banner-image">
    </section>

    <div class="under-banner">
        <p class="under-banner-bold">Затишний простір настільних рольових ігор.</p>
        <p class="under-banner-bold-text">Ваншоти для новачків, кампанії для фанів, досвідчені майстри, мініатюри й окремі кімнати.</p>
        <div class="under-banner-cta">
            <button type="button" class="cta-button" aria-label="Записатися на гру" title="Записатися на гру" onclick="document.getElementById('calendar').scrollIntoView({behavior: 'smooth'})">
                <span class="cta-button-text">Записатися на гру</span>
                <svg class="cta-button-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </div>
