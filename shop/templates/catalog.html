{% extends "base_shop.html" %}
{% load static %}
{% load querystring_tags %}

{% block title %}Каталог товарів | Huhy Shop{% endblock %}

{% block content %}
<div class="max-w-screen-2xl mx-auto py-10 px-4 lg:px-8">
  <!-- Кнопка для сховування/показу фільтрів -->
  <button id="toggle-filters" class="mb-4 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
    Показати/Сховати фільтри
  </button>
  <div class="flex flex-col lg:flex-row gap-8">
    <!-- Бічна панель з фільтрами та пошуком -->
    <aside id="filter-sidebar" class="w-full lg:w-1/4 bg-white rounded-lg shadow-lg p-6">
      <h2 class="text-2xl font-semibold mb-6 text-gray-800">Фільтри</h2>
      <form method="GET" action="{% url 'shop:catalog' %}" class="space-y-5">
        <!-- Пошук -->
        <div>
          <label for="search" class="block text-sm font-medium text-gray-700 mb-1">Пошук</label>
          <input type="text" name="q" id="search" placeholder="Введіть назву товару" class="block w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <!-- Категорії -->
        <div>
          <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Категорії</label>
          <select name="category" id="category" class="block w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Всі категорії</option>
            {% for cat in categories %}
              <option value="{{ cat.slug }}" {% if selected_category == cat.slug %}selected{% endif %}>{{ cat.name }}</option>
            {% endfor %}
          </select>
        </div>
        <!-- Діапазон цін -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Ціна</label>
          <div class="flex space-x-2">
            <input type="number" name="min_price" placeholder="Від" class="w-1/2 border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="number" name="max_price" placeholder="До" class="w-1/2 border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>
        <!-- Сортування -->
        <div>
          <label for="sort" class="block text-sm font-medium text-gray-700 mb-1">Сортувати за</label>
          <select name="sort" id="sort" class="block w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">За замовчуванням</option>
            <option value="price_asc" {% if request.GET.sort == "price_asc" %}selected{% endif %}>Ціна: за зростанням</option>
            <option value="price_desc" {% if request.GET.sort == "price_desc" %}selected{% endif %}>Ціна: за спаданням</option>
            <option value="new" {% if request.GET.sort == "new" %}selected{% endif %}>Новинки</option>
          </select>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition">
          Застосувати фільтри
        </button>
      </form>
    </aside>

    <!-- Список товарів (карточки) -->
    <section id="product-grid" class="w-full lg:w-3/4">
      {% include "catalog_products.html" %}
    </section>
  </div>
  <!-- Кнопка "Завантажити ще" для AJAX-підвантаження товарів -->
  <button id="load-more" class="mt-4 bg-green-600 text-white px-6 py-3 rounded-md hover:bg-green-700 transition">
    Завантажити ще
  </button>
</div>

<script>
// Функція для оновлення кількості колонок у сітці товарів.
// Контейнер сітки має id "products-grid", який задається у файлі catalog_products.html.
function updateGridColumns() {
    var filterSidebar = document.getElementById('filter-sidebar');
    var grid = document.getElementById('products-grid');
    if (!grid) return;
    if (filterSidebar.style.display === 'none') {
        grid.classList.remove('lg:grid-cols-3');
        grid.classList.add('lg:grid-cols-4');
    } else {
        grid.classList.remove('lg:grid-cols-4');
        grid.classList.add('lg:grid-cols-3');
    }
}

document.getElementById('toggle-filters').addEventListener('click', function() {
    var filterSidebar = document.getElementById('filter-sidebar');
    if (filterSidebar.style.display === 'none' || filterSidebar.style.display === '') {
        filterSidebar.style.display = 'block';
    } else {
        filterSidebar.style.display = 'none';
    }
    updateGridColumns();
});

var currentPage = {{ page_obj.number }};
var totalPages = {{ page_obj.paginator.num_pages }};

document.getElementById('load-more').addEventListener('click', function() {
    if (currentPage < totalPages) {
        var nextPage = currentPage + 1;
        var xhr = new XMLHttpRequest();
        var params = new URLSearchParams(window.location.search);
        params.set('page', nextPage);
        xhr.open('GET', window.location.pathname + '?' + params.toString(), true);
        xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
        xhr.onload = function() {
            if (xhr.status === 200) {
                var parser = new DOMParser();
                var doc = parser.parseFromString(xhr.responseText, 'text/html');
                var newGridContent = doc.getElementById('products-grid').innerHTML;
                var grid = document.getElementById('products-grid');
                grid.innerHTML += newGridContent;
                currentPage = nextPage;
                if (currentPage >= totalPages) {
                    document.getElementById('load-more').style.display = 'none';
                }
            }
        };
        xhr.send();
    }
});

// Виклик при завантаженні сторінки
updateGridColumns();
</script>
{% endblock %}
