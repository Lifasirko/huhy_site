{% extends "base_shop.html" %}
{% load static %}

{% block title %}Оформлення замовлення | Huhy Shop{% endblock %}

{% block content %}
<div class="max-w-screen-2xl mx-auto py-10 px-4 lg:px-8">
  <h1 class="text-3xl font-bold mb-6">Оформлення замовлення</h1>
  {% if error %}
  <div class="bg-red-200 text-red-800 p-4 rounded mb-6">
    {{ error }}
  </div>
  {% endif %}
  <form method="post" action="" class="bg-white rounded-lg shadow p-6 space-y-6">
    {% csrf_token %}
    <div>
      <label for="full_name" class="block text-lg font-medium text-gray-700 mb-2">Ім'я</label>
      <input type="text" name="full_name" id="full_name" required class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label for="phone" class="block text-lg font-medium text-gray-700 mb-2">Телефон</label>
      <input type="text" name="phone" id="phone" required class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label for="address" class="block text-lg font-medium text-gray-700 mb-2">Адреса доставки</label>
      <textarea name="address" id="address" required class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
    </div>
    <div>
      <label for="payment_method" class="block text-lg font-medium text-gray-700 mb-2">Спосіб оплати</label>
      <select name="payment_method" id="payment_method" required class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="online">Онлайн-оплата</option>
        <option value="cash">Готівка</option>
      </select>
    </div>
    <div>
      <label for="delivery_method" class="block text-lg font-medium text-gray-700 mb-2">Спосіб доставки</label>
      <select name="delivery_method" id="delivery_method" required class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="nova_poshta">Нова Пошта</option>
        <option value="pickup">Самовивіз</option>
      </select>
    </div>
    <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-md hover:bg-green-700 transition">
      Підтвердити замовлення
    </button>
  </form>
</div>
{% endblock %}
