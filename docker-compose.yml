version: '3.8'

services:
  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - ${DB_PORT}:${DB_PORT}
  web:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT}
    depends_on:
      - db
    volumes:
      - ./backup_20250430.sql:/app/backup/backup.sql:ro
      # щоб SEED_PATH міг читати initial.json/initial.sql
    command: [ "gunicorn", "--bind", ":8000", "alphahuhysite.wsgi:application" ]


volumes:
  postgres_data:
#    external: true
    name: ${DB_NAME}data
