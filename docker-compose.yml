version: '3.8'

services:
  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - ${DB_PORT}:${DB_PORT}


  web:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      SEED_ON_BOOT: "true"          # сидити на старті
      SEED_MODE: "sql"              # режим SQL дампу
      SEED_DIR: "/app/backups"      # де лежать файли
      SEED_GLOB: "backup_*.sql.gz"  # як шукати
    depends_on:
      - db
    volumes:
      - ./backups:/app/backups:ro
    command: [ "gunicorn", "--bind", ":8000", "alphahuhysite.wsgi:application" ]


volumes:
  postgres_data:
#    external: true
    name: ${DB_NAME}data
